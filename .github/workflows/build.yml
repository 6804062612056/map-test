name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"   # 🔥 เปลี่ยนจาก 3.11

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git zip unzip \
          openjdk-17-jdk \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          zlib1g-dev

    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.37

    - name: Clean
      run: rm -rf .buildozer ~/.buildozer

    - name: Build
      run: buildozer -v android debug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
